[package]
name = "dns-resolver"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort" 

[dependencies]
axum = "0.8.9"
hickory-proto = "0.26.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
serde_json = "1.0.151"
rand = "0.10.3"
dotenvy = "0.15.7"
constant_time_eq = "0.6.1"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
